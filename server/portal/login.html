<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به حساب | کلینیک لیانا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <div class="auth-gate" id="authGate"><img src="assets/logo.png" alt=""></div>
  <script>
    /* اگه این گوشی از قبل سشنِ پورتالِ مشتری داره (یعنی از رویِ کارتِ ویزیت اومده و لاگین بوده)،
       دیگه نباید فرمِ ورود رو ببینه — مستقیم بره تو حسابش. تا جوابِ این چک (یا حداکثر ۱.۲ ثانیه)
       نیومده، پوششِ برندی رو صفحه‌ست، نه فرمِ ورود؛ اگه لاگین نبود، همین‌جا فرم رو نشون می‌دیم. */
    (function () {
      var gate = document.getElementById('authGate');
      var settled = false;
      function reveal() {
        if (settled) return;
        settled = true;
        gate.classList.add('gate-hide');
        setTimeout(function () { gate.remove(); }, 300);
      }
      setTimeout(reveal, 1200); // فالبک: شبکه/سرور کند یا در دسترس نبود — بیشتر از این معطلِ فرم نمی‌مونیم
      fetch('/api/customer/auth/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (settled) return; // تایم‌اوت زودتر رسیده، دیگه دیره
          if (data && data.ok) {
            window.location.replace('/portal/index.html');
          } else {
            reveal();
          }
        })
        .catch(reveal);
    })();
  </script>

  <div class="wrap">
    <div class="brand">
      <span class="mark"><img src="assets/logo.png" alt="لیانا"></span>
      <span class="name">کلینیک لیانا</span>
    </div>

    <div class="card">
      <p class="eyebrow-label">پروفایلِ مشتری</p>
      <h1>ورود به پروفایل</h1>
      <p class="sub">با همون شماره‌ای که تو کلینیک ثبت کردی وارد شو. بارِ اوّل، پذیرشِ کلینیک حسابت رو فعال می‌کنه و رمزِ اوّلیه رو بهت می‌گه.</p>

      <div class="msg" id="msgBox"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="phoneInput">شماره‌ی موبایل</label>
          <input type="tel" id="phoneInput" inputmode="numeric" placeholder="09xxxxxxxxx" autocomplete="tel" dir="ltr">
        </div>
        <div class="field">
          <label for="passwordInput">رمز</label>
          <input type="password" id="passwordInput" autocomplete="current-password" dir="ltr">
        </div>
        <button class="btn" id="loginBtn" type="submit">ورود</button>
      </form>
      <p class="hint">رمزت یادت رفته؟ از پذیرشِ کلینیک بخواه ریستش کنه.</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
