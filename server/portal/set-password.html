<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعیینِ رمز | کلینیک لیانا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <div class="auth-gate" id="authGate"><img src="assets/logo.png" alt=""></div>

  <div class="wrap">
    <div class="brand">
      <span class="mark"><img src="assets/logo.png" alt="لیانا"></span>
      <span class="name">کلینیک لیانا</span>
    </div>

    <div class="card">
      <p class="eyebrow-label">پروفایلِ مشتری</p>
      <h1>رمزِ خودت رو بذار</h1>
      <p class="sub" id="subText">این بارِ اوّلیه که وارد می‌شی. قبل از دیدنِ پروفایلت، یه رمزِ شخصی انتخاب کن تا از این به بعد با همون وارد بشی.</p>

      <div class="msg" id="msgBox"></div>

      <form id="setPasswordForm" novalidate>
        <div class="field">
          <label for="newPassword">رمزِ جدید</label>
          <input type="password" id="newPassword" autocomplete="new-password" dir="ltr">
        </div>
        <div class="field">
          <label for="newPassword2">تکرارِ رمزِ جدید</label>
          <input type="password" id="newPassword2" autocomplete="new-password" dir="ltr">
        </div>
        <button class="btn" id="saveBtn" type="submit">ذخیره و ورود به پروفایل</button>
      </form>
      <p class="hint">حداقل ۶ کاراکتر، و نمی‌تونه همون ۱۲۳۴۵۶ باشه.</p>
      <p class="hint"><button id="cancelBtn" type="button">خروج</button></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/set-password.js"></script>
</body>
</html>
