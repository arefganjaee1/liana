# nginx reverse-proxy برای پنلِ ادمین + API بک‌اندِ لیانا (پروسه‌ی Node رو پورتِ 3001، با pm2 نگه‌داشته می‌شه)
# مسیرِ نصب رو سرور معمولاً: /etc/nginx/sites-available/panel.liana.arefprojects.ir.conf
# بعدِ کپی: sudo ln -s /etc/nginx/sites-available/panel.liana.arefprojects.ir.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name panel.liana.arefprojects.ir;

    client_max_body_size 10m;  # آپلودِ عکسِ خدمات تا ۸ مگابایته (محدودیتِ multer)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
