# nginx — سایتِ عمومیِ کلینیک (دامنه‌ی جدید: beautyliana.ir)
# دقیقاً همون document rootِ liana.arefprojects.ir (فایل‌ها عوض نمی‌شن، فقط دامنه‌ی جدید بهش اضافه می‌شه)
# نصب رو سرور:
#   sudo cp beautyliana.ir.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/beautyliana.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d beautyliana.ir -d www.beautyliana.ir

server {
    listen 80;
    listen [::]:80;
    server_name beautyliana.ir www.beautyliana.ir;

    root /var/www/liana;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
