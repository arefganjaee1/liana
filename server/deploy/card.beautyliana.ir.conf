# nginx — صفحه‌ی کارتِ NFC (دامنه‌ی جدید: card.beautyliana.ir)
# دقیقاً همون document rootِ card.liana.arefprojects.ir
# نصب رو سرور:
#   sudo cp card.beautyliana.ir.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/card.beautyliana.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d card.beautyliana.ir

server {
    listen 80;
    listen [::]:80;
    server_name card.beautyliana.ir;

    root /var/www/liana-repo/site/card;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
