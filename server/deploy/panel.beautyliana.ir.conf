# nginx reverse-proxy برای پنلِ ادمین + پورتالِ مشتری + API بک‌اندِ لیانا (دامنه‌ی جدید: panel.beautyliana.ir)
# همون پروسه‌ی Node رو پورتِ 3001 (با pm2 نگه‌داشته می‌شه) — این فقط یه دامنه‌ی دومه رو همون بک‌اند، نه یه سرویسِ جدا.
# نصب رو سرور:
#   sudo cp panel.beautyliana.ir.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/panel.beautyliana.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.beautyliana.ir
#
# نکته‌ی مهم: بعدِ اینِکه SSL این دامنه گرفته شد، تو فایلِ .envِ سرور (server/.env) این خط رو اضافه/عوض کن:
#   CUSTOMER_COOKIE_DOMAIN_NAME=beautyliana.ir
# و بعدش pm2 restart liana-panel — وگرنه کوکیِ سشنِ مشتری هنوز رو دامنه‌ی قدیمی ست می‌شه.

server {
    listen 80;
    listen [::]:80;
    server_name panel.beautyliana.ir;

    client_max_body_size 10m;  # آپلودِ عکسِ خدمات تا ۸ مگابایته (محدودیتِ multer)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
