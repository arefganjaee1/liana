<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنلِ مدیریتِ لیانا</title>

<body>
<script>
// اگه لاگین کرده باشی می‌بره تو خدمات، وگرنه می‌بره صفحه‌ی ورود
fetch('/api/auth/me', { credentials: 'include' })
  .then((res) => {
    window.location.replace(res.ok ? '/admin/services.html' : '/admin/login.html');
  })

</script>
